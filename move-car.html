<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挪车二维码</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 24px;
  padding: 40px 32px 32px;
  max-width: 360px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
}
.car-icon {
  font-size: 64px;
  margin-bottom: 16px;
}
h1 {
  font-size: 24px;
  color: #1a202c;
  margin-bottom: 8px;
  font-weight: 700;
}
.subtitle {
  color: #718096;
  font-size: 14px;
  margin-bottom: 24px;
  line-height: 1.5;
}
.qr-container {
  display: inline-block;
  padding: 16px;
  background: #f7fafc;
  border-radius: 16px;
  margin-bottom: 20px;
}
#qrcode {
  display: flex;
  justify-content: center;
}
#qrcode img, #qrcode canvas, #qrcode svg {
  display: block;
  width: 180px !important;
  height: 180px !important;
}
.btn {
  display: inline-block;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
  width: 100%;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.status {
  margin-top: 16px;
  font-size: 14px;
  padding: 8px 0;
  min-height: 36px;
}
.status.success { color: #48bb78; }
.status.error { color: #f56565; }
.hint {
  margin-top: 24px;
  padding: 12px;
  background: #fffaf0;
  border-radius: 8px;
  font-size: 12px;
  color: #a0aec0;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="car-icon">🚗</div>
  <h1>临时停车</h1>
  <p class="subtitle">如需挪车，请点击下方发送通知<br>车主会在第一时间收到消息</p>
  <div class="qr-container">
    <div id="qrcode"></div>
  </div>
  <button class="btn" onclick="notifyOwner()" id="notifyBtn">📱 发送挪车通知</button>
  <div class="status" id="status"></div>
  <div class="hint">
    <strong>使用说明</strong>：扫码后点击按钮即可，<br>您不会被跟踪定位，请放心使用。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// Generate QR code pointing to this page
(function() {
  // URL without hash/query to avoid duplicates
  var url = window.location.href.split('?')[0].split('#')[0];
  document.getElementById('qrcode').innerHTML = '';
  try {
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 180,
      height: 180,
      colorDark: '#1a202c',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    console.error('QR code generation failed:', e);
  }
})();

// Apprise API endpoint on 4gwifi
const API_URL = 'http://myres.freemyip.com:5281/notify/';

function notifyOwner() {
  var btn = document.getElementById('notifyBtn');
  var status = document.getElementById('status');

  btn.disabled = true;
  btn.textContent = '⏳ 发送中...';
  status.textContent = '';
  status.className = 'status';

  var now = new Date();
  var timeStr = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');

  // Try both fetch approaches for CORS compatibility
  fetch(API_URL, {
    method: 'POST',
    mode: 'cors',
    cache: 'no-cache',
    headers: {
      'Content-Type': 'application/json',
      'Accept': '*/*'
    },
    body: JSON.stringify({
      title: '🚗 挪车通知',
      body: '您好，您的爱车收到了挪车请求。\n通知时间: ' + timeStr + '\n请尽快联系车主挪车，感谢您的配合。',
      type: 'warning'
    })
  })
  .then(function(response) {
    if (response.ok) {
      status.textContent = '✅ 通知已发送，车主稍后会收到提醒';
      status.className = 'status success';
      btn.textContent = '✅ 发送成功';
    } else {
      throw new Error('Server returned ' + response.status);
    }
  })
  .catch(function(err) {
    console.error('Fetch error:', err);
    status.textContent = '❌ 发送失败: ' + (err.message || '网络错误，请稍后重试');
    status.className = 'status error';
  })
  .finally(function() {
    btn.disabled = false;
    setTimeout(function() {
      if (!status.classList.contains('success')) {
        btn.textContent = '📱 发送挪车通知';
      }
    }, 3000);
  });
}
</script>
</body>
</html>
