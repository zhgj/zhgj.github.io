<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e53935">
<title>挪车通知</title>
<style>
  :root {
    --primary: #e53935;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-2: #6b6b6b;
    --border: #e6e6e6;
    --ok: #2e7d32;
    --ok-bg: #e8f5e9;
    --err: #c62828;
    --err-bg: #ffebee;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height:100vh; display:flex; justify-content:center;
  }
  .wrap {
    width:100%; max-width:480px; padding:20px 16px 32px;
    display:flex; flex-direction:column; min-height:100vh;
  }

  .hero { text-align:center; padding:24px 12px 20px; }
  .hero-icon { font-size:56px; line-height:1; margin-bottom:12px; }
  .hero h1 { font-size:26px; font-weight:800; letter-spacing:.5px; margin-bottom:8px; }
  .hero p { color:var(--text-2); font-size:15px; line-height:1.65; }

  .card {
    background:var(--card); border-radius:var(--radius);
    box-shadow:0 2px 14px rgba(0,0,0,.07);
    padding:22px 20px; margin-bottom:14px;
  }

  .plate {
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:18px; background:#fafafa; border:1px solid var(--border);
    border-radius:12px; margin-bottom:18px;
  }
  .plate-icon { font-size:28px; }
  .plate-text { font-size:26px; font-weight:800; letter-spacing:2px; }

  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:18px 24px; font-size:19px; font-weight:700;
    border:none; border-radius:52px; cursor:pointer; transition:transform .12s, opacity .2s;
    font-family:inherit; color:#fff; background:var(--primary);
    box-shadow:0 6px 18px rgba(229,57,53,.32);
  }
  .btn:active { transform:scale(.98); }
  .btn[disabled] { opacity:.55; box-shadow:none; cursor:default; }

  .feedback { margin-top:16px; padding:16px; border-radius:12px; text-align:center; display:none; }
  .fb-ok { background:var(--ok-bg); color:var(--ok); }
  .fb-err { background:var(--err-bg); color:var(--err); }
  .fb-icon { font-size:30px; margin-bottom:8px; line-height:1; }
  .fb-title { font-size:17px; font-weight:700; margin-bottom:5px; }
  .fb-text { font-size:14px; line-height:1.6; opacity:.9; }

  /* 通知没送达时的兜底：直接打电话 */
  .fallback { text-align:center; }
  .fb-label { font-size:13px; color:var(--text-2); margin-bottom:8px; }
  .tel {
    display:inline-flex; align-items:center; gap:8px;
    font-size:24px; font-weight:800; letter-spacing:1px;
    color:var(--primary); text-decoration:none;
    padding:12px 24px; border-radius:12px; background:#fdeeee;
  }
  .tel:active { background:#f8dcdc; }
  .fb-hint { font-size:13px; color:var(--text-2); margin-top:10px; line-height:1.6; }

  .status {
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:10px; color:var(--text-2); font-size:13px;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#bdbdbd; }
  .dot.on { background:#43a047; } .dot.off { background:#e53935; } .dot.wait { background:#fb8c00; }

  .foot { margin-top:auto; padding:24px 10px 4px; text-align:center; color:#9a9a9a; font-size:12px; line-height:1.8; }

  .spin { width:26px; height:26px; border:3px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-icon">🚗</div>
    <h1>麻烦挪一下车</h1>
    <p>这辆车挡住了通道<br>点一下就能通知车主</p>
  </div>

  <div class="card">
    <div class="plate">
      <span class="plate-icon">🚙</span>
      <span class="plate-text" id="plate">车辆在此</span>
    </div>

    <button class="btn" id="sendBtn">
      <span id="btnIcon">📬</span>
      <span id="btnText">通知车主挪车</span>
    </button>

    <div class="feedback" id="feedback"></div>
  </div>

  <!-- 通知没送达时的兜底：直接打电话 -->
  <div class="card fallback">
    <div class="fb-label">车主暂时挪不开？直接打电话：</div>
    <a class="tel" href="tel:17700006606" id="telLink">
      <span>📞</span><span id="telText">177 0000 6606</span>
    </a>
    <div class="fb-hint">电话来自车主在车辆上留的信息</div>
  </div>

  <div class="status">
    <span class="dot wait" id="dot"></span>
    <span id="connText">正在连接通知服务…</span>
  </div>

  <div class="foot">
    请勿恶意骚扰，本页面仅用于挪车沟通
  </div>
</div>

<script>
// ====== 车主维护的配置（路人不需要关心）======
const TOPIC = 'movecar-zh-gj';        // ntfy 队列，须与 4gwifi 轮询器一致
const NTFY_BASE = 'https://ntfy.sh';
const MSG_PREFIX = 'MOVECAR|';
const PLATE_TEXT = '车辆在此';          // 可改成车牌，如 浙A·88888
const PHONE_DISPLAY = '177 0000 6606'; // 车主电话（显示用）
const PHONE_DIAL = '17700006606';      // 车主电话（拨号用）

const btn = document.getElementById('sendBtn');
const btnIcon = document.getElementById('btnIcon');
const btnText = document.getElementById('btnText');
const feedback = document.getElementById('feedback');
const dot = document.getElementById('dot');
const connText = document.getElementById('connText');

document.getElementById('plate').textContent = PLATE_TEXT;
document.getElementById('telLink').href = 'tel:' + PHONE_DIAL;
document.getElementById('telText').textContent = PHONE_DISPLAY;

let sending = false;

function showFeedback(kind, icon, title, text) {
  feedback.className = 'feedback ' + (kind === 'ok' ? 'fb-ok' : 'fb-err');
  feedback.innerHTML =
    '<div class="fb-icon">' + icon + '</div>' +
    '<div class="fb-title">' + title + '</div>' +
    '<div class="fb-text">' + text + '</div>';
  feedback.style.display = 'block';
}

async function sendNotify() {
  if (sending) return;
  sending = true;
  btn.disabled = true;
  btnIcon.innerHTML = '<span class="spin"></span>';
  btnText.textContent = '发送中…';
  feedback.style.display = 'none';

  try {
    const resp = await fetch(NTFY_BASE + '/' + TOPIC, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: MSG_PREFIX + '有人在您车前需要挪车，请尽快处理'
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    await resp.json().catch(() => ({}));

    btnIcon.textContent = '✅';
    btnText.textContent = '已通知车主';
    showFeedback('ok', '✅', '通知已发送给车主',
      '车主会尽快赶来挪车。<br>若长时间没有动静，请直接拨打上面的电话。');
  } catch (err) {
    btnIcon.textContent = '📬';
    btnText.textContent = '通知车主挪车';
    showFeedback('err', '⚠️', '网络不太顺畅，没能发出去',
      '请直接拨打上面的电话联系车主，<br>给您添麻烦了。');
  } finally {
    sending = false;
    btn.disabled = false;
    checkHealth();
  }
}

// 轻量连通性检查：只探测一次，不打扰路人
async function checkHealth() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const resp = await fetch(NTFY_BASE + '/' + TOPIC + '/json?poll=1', {
      mode: 'cors', signal: ctrl.signal
    });
    clearTimeout(timer);
    if (resp.ok) {
      dot.className = 'dot on';
      connText.textContent = '通知服务正常';
    } else {
      dot.className = 'dot off';
      connText.textContent = '通知服务异常，可直接打电话';
    }
  } catch (e) {
    dot.className = 'dot off';
    connText.textContent = '网络受限，可直接打电话';
  }
}

btn.addEventListener('click', sendNotify);
checkHealth();
</script>
</body>
</html>
